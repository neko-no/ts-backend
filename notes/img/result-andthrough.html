<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>andThrough：成功値は変えず、検証の失敗だけ反映する</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans JP', 'Hiragino Sans', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
      --font-mono:     'Geist Mono', 'Noto Sans JP', 'Hiragino Sans', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Result · ch04 4.2.5</p>
    <h1>andThrough：成功値は変えず、検証の失敗だけ反映する</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="result-andthrough-title result-andthrough-desc">
        <title id="result-andthrough-title">andThrough：成功値は変えず、検証の失敗だけ反映する</title>
        <desc id="result-andthrough-desc">Ok のときは関数 f の結果で分かれ、f が Ok を返せば元の成功値のまま、f が Err を返せばその Err が結果になる。Err のときは f を呼ばずに Err(E) を返す流れを示す図。</desc>
        <defs>
          <marker id="result-andthrough-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="result-andthrough-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="240" y1="132" x2="380" y2="132" stroke="#bf4520" stroke-width="1.2" marker-end="url(#result-andthrough-arrow-accent)"/>
        <path d="M580 112 H672 Q680 112 680 104 V100 Q680 92 688 92 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#result-andthrough-arrow)"/>
        <path d="M580 152 H672 Q680 152 680 160 V164 Q680 172 688 172 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#result-andthrough-arrow)"/>
        <line x1="240" y1="292" x2="720" y2="292" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#result-andthrough-arrow)"/>
        <rect x="40" y="100" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="100" width="200" height="64" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/>
        <text x="140.0" y="128.0" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">Ok(T)</text>
        <text x="140.0" y="146.0" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">成功のとき</text>
        <rect x="380" y="92" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="92" width="200" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="480.0" y="128.0" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">f</text>
        <text x="480.0" y="146.0" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono','Noto Sans JP',monospace">(t: T) =&gt; Result&lt;_, F&gt;</text>
        <rect x="720" y="60" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="60" width="200" height="64" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/>
        <text x="820.0" y="88.0" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">Ok(T)</text>
        <text x="820.0" y="106.0" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">元の成功値のまま</text>
        <rect x="720" y="140" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="140" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
        <text x="820.0" y="168.0" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">Err(F)</text>
        <text x="820.0" y="186.0" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">f の Err が結果になる</text>
        <rect x="40" y="260" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="260" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
        <text x="140.0" y="288.0" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">Err(E)</text>
        <text x="140.0" y="306.0" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">エラーのとき</text>
        <rect x="720" y="260" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="260" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
        <text x="820.0" y="288.0" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">Err(E)</text>
        <text x="820.0" y="306.0" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">エラーはそのまま</text>
        <rect x="594.0" y="92" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="626" y="104" fill="#4f5d75" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">f が Ok</text>
        <rect x="590.0" y="156" width="72" height="16" rx="2" fill="#f5f5f5"/>
        <text x="626" y="168" fill="#4f5d75" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">f が Err</text>
        <rect x="434.0" y="270" width="92" height="16" rx="2" fill="#f5f5f5"/>
        <text x="480.0" y="282" fill="#4f5d75" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">f は呼ばれない</text>
        <line x1="40" y1="360" x2="920" y2="360" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="388" fill="#4f5d75" font-size="8" letter-spacing="0.14em" font-family="'Geist Mono','Noto Sans JP',monospace">LEGEND</text>
        <rect x="116" y="378" width="28" height="14" rx="3" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/>
        <text x="152" y="389" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">Ok（成功）</text>
        <rect x="232" y="378" width="28" height="14" rx="3" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
        <text x="268" y="389" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">Err（エラー）</text>
        <rect x="364" y="378" width="28" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="400" y="389" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">渡した関数 f</text>
        <line x1="500" y1="385" x2="536" y2="385" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="544" y="389" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">f を呼ばずに通る</text>
      </svg>
    </div>
  </div>
</body>
</html>
