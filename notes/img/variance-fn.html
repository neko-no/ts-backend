<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>関数型の変性：引数は反変、戻り値は共変</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans JP', 'Hiragino Sans', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
      --font-mono:     'Geist Mono', 'Noto Sans JP', 'Hiragino Sans', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Variance · ch01 1.2.5</p>
    <h1>関数型の変性：引数は反変、戻り値は共変</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="variance-fn-title variance-fn-desc">
        <title id="variance-fn-title">関数型の変性：引数は反変、戻り値は共変</title>
        <desc id="variance-fn-desc">変数 f の関数型に別の関数 g を代入できる条件として、引数は基本型の方向へ、戻り値は部分型の方向へ動かしてよいことと、メソッド記法とプロパティ記法の違いを示す図。</desc>
        <defs>
          <marker id="variance-fn-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 列見出し -->
        <text x="250" y="54" fill="#4f5d75" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">f の型（変数に宣言した型）</text>
        <text x="710" y="54" fill="#4f5d75" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">g の型（実際に代入する関数）</text>
        <text x="480" y="54" fill="#5a6580" font-size="9" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">const f: 型 = g</text>

        <!-- 行ラベル -->
        <text x="30" y="154" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">引数</text>
        <text x="30" y="170" fill="#5a6580" font-size="8" letter-spacing="0.1em" font-family="'Geist Mono',monospace">ARGUMENT</text>
        <text x="30" y="274" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">戻り値</text>
        <text x="30" y="290" fill="#5a6580" font-size="8" letter-spacing="0.1em" font-family="'Geist Mono',monospace">RETURN</text>

        <!-- 矢印（先に描く）: 引数 Manager -> Employee -->
        <line x1="370" y1="160" x2="590" y2="160" stroke="#bf4520" stroke-width="1.4" marker-end="url(#variance-fn-arrow-accent)"/>
        <rect x="395" y="128" width="170" height="18" rx="2" fill="#f5f5f5"/>
        <text x="480" y="141" fill="#bf4520" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">反変：基本型へ広げてよい</text>

        <!-- 矢印: 戻り値 Employee -> Manager -->
        <line x1="370" y1="280" x2="590" y2="280" stroke="#bf4520" stroke-width="1.4" marker-end="url(#variance-fn-arrow-accent)"/>
        <rect x="395" y="248" width="170" height="18" rx="2" fill="#f5f5f5"/>
        <text x="480" y="261" fill="#bf4520" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">共変：部分型へ狭めてよい</text>

        <!-- ノード: 引数 -->
        <rect x="130" y="128" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="128" width="240" height="64" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/>
        <text x="250" y="156" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">Manager</text>
        <text x="250" y="174" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono','Noto Sans JP',monospace">(arg: Manager) の arg</text>

        <rect x="590" y="128" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="590" y="128" width="240" height="64" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/>
        <text x="710" y="156" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">Employee</text>
        <text x="710" y="174" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono','Noto Sans JP',monospace">(arg: Employee) の arg</text>

        <!-- ノード: 戻り値 -->
        <rect x="130" y="248" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="248" width="240" height="64" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/>
        <text x="250" y="276" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">Employee</text>
        <text x="250" y="294" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono','Noto Sans JP',monospace">=&gt; Employee の戻り値</text>

        <rect x="590" y="248" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="590" y="248" width="240" height="64" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/>
        <text x="710" y="276" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">Manager</text>
        <text x="710" y="294" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono','Noto Sans JP',monospace">=&gt; Manager の戻り値</text>

        <!-- 区切り: interface 内の記法 -->
        <line x1="30" y1="340" x2="930" y2="340" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="30" y="366" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">interface の中の書き方でも変わる</text>

        <!-- プロパティ記法 -->
        <rect x="130" y="388" width="330" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="388" width="330" height="72" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/>
        <text x="295" y="414" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">プロパティ記法：引数は反変（推奨）</text>
        <text x="295" y="436" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">fn: (arg: Employee) =&gt; void</text>

        <!-- メソッド記法（破線 = 推奨されない） -->
        <rect x="500" y="388" width="330" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="388" width="330" height="72" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="665" y="414" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">メソッド記法：引数は双変</text>
        <text x="665" y="436" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">fn(arg: Employee): void</text>

        <text x="665" y="482" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">既存の JavaScript コードとの後方互換性のため</text>

        <!-- 凡例 -->
        <line x1="30" y1="520" x2="930" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="544" fill="#4f5d75" font-size="8" letter-spacing="0.14em" font-family="'Geist Mono',monospace">LEGEND</text>
        <line x1="108" y1="541" x2="148" y2="541" stroke="#bf4520" stroke-width="1.4" marker-end="url(#variance-fn-arrow-accent)"/>
        <text x="158" y="545" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">g の型が動かしてよい方向</text>
        <rect x="340" y="534" width="28" height="14" rx="3" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="378" y="545" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">破線の枠 = 推奨されない書き方</text>
      </svg>
    </div>
  </div>
</body>
</html>
