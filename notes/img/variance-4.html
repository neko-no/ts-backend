<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>変性の整理：T の位置に何を入れてよいか</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans JP', 'Hiragino Sans', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
      --font-mono:     'Geist Mono', 'Noto Sans JP', 'Hiragino Sans', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Matrix · Variance · ch01 1.2.5</p>
    <h1>変性の整理：T の位置に何を入れてよいか</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="variance-4-title variance-4-desc">
        <title id="variance-4-title">変性の整理：T の位置に何を入れてよいか</title>
        <desc id="variance-4-desc">不変・共変・反変・双変の4つが、基本型の方向と部分型の方向のどちらを許すかで決まることを、関数の戻り値・引数・メソッド記法の対応とともに示す表形式の図。</desc>
        <defs>
          <marker id="variance-4-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 上部の方向軸 -->
        <text x="240" y="48" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">基本型の方向（値の集合が広い）</text>
        <text x="720" y="48" fill="#4f5d75" font-size="10" text-anchor="end" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">部分型の方向（値の集合が狭い）</text>
        <line x1="240" y1="62" x2="720" y2="62" stroke="#4f5d75" stroke-width="1" marker-start="url(#variance-4-arrow)" marker-end="url(#variance-4-arrow)"/>

        <!-- 列ヘッダー（基本型 / T / 部分型） -->
        <rect x="225" y="78" width="150" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="225" y="78" width="150" height="44" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="98" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">基本型 Base</text>
        <text x="300" y="113" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono','Noto Sans JP','Hiragino Sans',monospace">T より広い</text>

        <rect x="405" y="78" width="150" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="405" y="78" width="150" height="44" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1.6"/>
        <text x="480" y="98" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">T</text>
        <text x="480" y="113" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono','Noto Sans JP','Hiragino Sans',monospace">期待されている型</text>

        <rect x="585" y="78" width="150" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="585" y="78" width="150" height="44" rx="6" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/>
        <text x="660" y="98" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">部分型 Sub</text>
        <text x="660" y="113" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono','Noto Sans JP','Hiragino Sans',monospace">T より狭い</text>

        <text x="770" y="104" fill="#4f5d75" font-size="11" font-weight="600" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">TypeScript での現れ方</text>

        <!-- 行の区切り線 -->
        <g stroke="rgba(45,49,66,0.12)" stroke-width="0.8">
          <line x1="30" y1="150" x2="930" y2="150"/>
          <line x1="30" y1="230" x2="930" y2="230"/>
          <line x1="30" y1="310" x2="930" y2="310"/>
          <line x1="30" y1="390" x2="930" y2="390"/>
          <line x1="30" y1="470" x2="930" y2="470"/>
        </g>

        <!-- 許される範囲のバー（先に描く） -->
        <rect x="456" y="176" width="48" height="28" rx="14" fill="rgba(79,93,117,0.12)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="456" y="256" width="228" height="28" rx="14" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="276" y="336" width="228" height="28" rx="14" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="276" y="416" width="408" height="28" rx="14" fill="rgba(79,93,117,0.12)" stroke="#4f5d75" stroke-width="1"/>

        <!-- 行1: 不変 -->
        <circle cx="300" cy="190" r="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="3,3"/>
        <circle cx="480" cy="190" r="6" fill="#4f5d75"/>
        <circle cx="660" cy="190" r="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="30" y="180" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">不変</text>
        <text x="30" y="196" fill="#5a6580" font-size="8" letter-spacing="0.1em" font-family="'Geist Mono',monospace">INVARIANCE</text>
        <text x="30" y="214" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">T だけ</text>
        <text x="770" y="194" fill="#5a6580" font-size="12" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">—</text>

        <!-- 行2: 共変 -->
        <circle cx="300" cy="270" r="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="3,3"/>
        <circle cx="480" cy="270" r="6" fill="#bf4520"/>
        <circle cx="660" cy="270" r="6" fill="#bf4520"/>
        <text x="30" y="260" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">共変</text>
        <text x="30" y="276" fill="#5a6580" font-size="8" letter-spacing="0.1em" font-family="'Geist Mono',monospace">COVARIANCE</text>
        <text x="30" y="294" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">T と、その部分型</text>
        <text x="770" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">関数の戻り値</text>
        <text x="770" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">(arg) =&gt; R の R</text>

        <!-- 行3: 反変 -->
        <circle cx="300" cy="350" r="6" fill="#bf4520"/>
        <circle cx="480" cy="350" r="6" fill="#bf4520"/>
        <circle cx="660" cy="350" r="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="30" y="340" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">反変</text>
        <text x="30" y="356" fill="#5a6580" font-size="8" letter-spacing="0.1em" font-family="'Geist Mono',monospace">CONTRAVARIANCE</text>
        <text x="30" y="374" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">T と、その基本型</text>
        <text x="770" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">関数の引数</text>
        <text x="770" y="362" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">プロパティ記法も同じ</text>

        <!-- 行4: 双変 -->
        <circle cx="300" cy="430" r="6" fill="#4f5d75"/>
        <circle cx="480" cy="430" r="6" fill="#4f5d75"/>
        <circle cx="660" cy="430" r="6" fill="#4f5d75"/>
        <text x="30" y="420" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">双変</text>
        <text x="30" y="436" fill="#5a6580" font-size="8" letter-spacing="0.1em" font-family="'Geist Mono',monospace">BIVARIANCE</text>
        <text x="30" y="454" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">T、部分型、基本型のすべて</text>
        <text x="770" y="426" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">メソッド記法の引数</text>
        <text x="770" y="442" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">後方互換性のため</text>

        <!-- 例（注釈） -->
        <text x="480" y="496" fill="#4f5d75" font-size="11" text-anchor="middle" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">例: Manager は Employee の部分型。T = Employee なら Sub = Manager、T = Manager なら Base = Employee。</text>

        <!-- 凡例 -->
        <line x1="30" y1="520" x2="930" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="544" fill="#4f5d75" font-size="8" letter-spacing="0.14em" font-family="'Geist Mono',monospace">LEGEND</text>
        <circle cx="120" cy="541" r="6" fill="#4f5d75"/>
        <text x="134" y="545" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">代入してよい</text>
        <circle cx="244" cy="541" r="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="258" y="545" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">代入できない</text>
        <rect x="372" y="534" width="28" height="14" rx="7" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="408" y="545" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans JP','Hiragino Sans',sans-serif">関数の戻り値・引数に対応する（共変・反変）</text>
      </svg>
    </div>
  </div>
</body>
</html>
